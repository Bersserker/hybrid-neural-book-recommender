[project]
name = "hybrid-neural-book-recommender"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Bersserker", email = "bertech@yandex.ru" }
]
requires-python = ">=3.12"
dependencies = [
    "joblib>=1.6.0",
    "kagglehub>=1.0.2",
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "pandas>=3.0.6",
    "pyyaml>=6.0.3",
    "scikit-learn>=1.9.1",
    "scipy>=1.18.1",
    "seaborn>=0.13.2",
    "surprise>=0.1",
    "torch>=2.14.1",
    "wordcloud>=1.9.6",
]

[project.scripts]
hybrid-neural-book-recommender = "hybrid_neural_book_recommender:main"

[build-system]
requires = ["uv_build>=0.11.7,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "jupyter>=1.1.1",
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]
